<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnderSMP — Staff Access</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="js/staff-config.js"></script>
  <script src="js/staff-auth.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <p style="font-size: 0.75rem; color: var(--magenta); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.5rem;">Internal Access</p>
      <h2>Staff Portal</h2>
      <p style="color: var(--lilac-dim); font-size: 0.85rem; margin-top: 0.5rem;">
        Hashed passcode authentication required for staff entry.
      </p>
      
      <form class="login-form" onsubmit="return handleStaffLogin(event);">
        <div class="form-group">
          <label for="staff-email">Staff Email</label>
          <input type="email" id="staff-email" class="form-input" placeholder="name@domain.com" required>
        </div>
        <div class="form-group">
          <label for="staff-passcode">Staff Passcode</label>
          <input type="password" id="staff-passcode" class="form-input" placeholder="Enter secret passcode" required>
        </div>
        <button type="submit" class="submit-btn">Authenticate</button>
      </form>

      <div id="login-status"></div>
    </div>
  </div>
</body>
</html>
