<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Down for Maintenance — Ender SMP</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .maint-wrap{
    min-height: 100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 100px 6vw;
    position:relative; z-index:2;
  }
  .maint-icon{
    width: 120px; height:auto;
    margin-bottom: 2rem;
    filter: drop-shadow(0 0 30px rgba(168,85,247,0.5));
    animation: bob 3s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-10px); } }
  .maint-wrap h1{
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    text-shadow: 0 0 40px rgba(168,85,247,0.5);
    margin-bottom: 1rem;
  }
  .maint-wrap p{
    max-width: 480px;
    color: var(--lilac-dim);
    margin-bottom: 2rem;
  }
  @media (prefers-reduced-motion: reduce){ .maint-icon{ animation: none; } }
</style>
</head>
<body data-page="maintenance">

<div id="particles"></div>

<div class="maint-wrap">
  <img class="maint-icon" src="assets/maintence_icon.png" alt="Under maintenance">
  <div class="eyebrow">Server Status</div>
  <h1 class="pixel">We're patching the void.</h1>
  <p>Ender SMP is down for scheduled maintenance right now — new features, bug fixes, or just staff finally organizing the plugin folder. Check our Discord for live updates and an ETA.</p>
  <a class="discord-cta" href="https://discord.gg/vQBeGj7jYq" target="_blank" rel="noopener">Check Discord for Updates →</a>
  <a href="staff-login.html" class="back-link" style="margin-top:1.6rem; font-size:0.8rem; color:var(--lilac-dim); text-decoration:underline;">Staff Login</a>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
