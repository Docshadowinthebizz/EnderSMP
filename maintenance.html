<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnderSMP — Under Maintenance</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .maint-container {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .maint-box {
      background: rgba(34, 16, 63, 0.6);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 3.5rem 2.5rem;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 0 60px rgba(168, 85, 247, 0.25);
    }
  </style>
</head>
<body>
  <div class="maint-container">
    <div class="maint-box">
      <p style="font-size: 0.78rem; color: var(--magenta); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.8rem;">Scheduled Downtime</p>
      <h1 style="font-size: 1.8rem; margin-bottom: 1rem;">Realm Shifting...</h1>
      <p style="color: var(--lilac-dim); font-size: 0.95rem; margin-bottom: 2rem;">
        EnderSMP is currently undergoing server updates. Join our Discord community for real-time status updates.
      </p>
      <a href="https://discord.gg/endersmp" class="discord-cta">Join Discord Community</a>
    </div>
  </div>

  <footer>
    <p>&copy; EnderSMP. All rights reserved.</p>
    <div class="footer-links">
      <a href="staff-login.html" class="footer-staff-link">Staff Portal</a>
    </div>
  </footer>
</body>
</html>
